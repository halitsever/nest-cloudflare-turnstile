name: Bug report
description: Something does not work as the documentation says
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      description: Link a minimal repository, or paste the module options and the request you sent. Remove your secret key.
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: nest-cloudflare-turnstile version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: nest-version
    attributes:
      label: NestJS version
      placeholder: 12.2.0
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: 24.10.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Where does the guard run?
      options:
        - Express
        - Fastify
        - GraphQL with Apollo
        - GraphQL with Mercurius
        - Somewhere else
    validations:
      required: true
