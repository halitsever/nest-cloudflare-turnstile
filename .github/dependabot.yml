version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Gives the registry a week to pull compromised releases before they reach a PR.
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Types follow the oldest supported Node.js line, not the newest.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # typescript-eslint does not support TypeScript 7 yet.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
