name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  # npm trusted publishing exchanges this OIDC token for a short-lived publish credential.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 24 ships npm 11.5.1 or newer, which trusted publishing requires.
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm publish
