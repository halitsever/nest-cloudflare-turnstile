name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  # npm trusted publishing exchanges this OIDC token for a short-lived publish credential.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Current Node 24 releases ship npm 11.5.1 or newer, which trusted publishing requires.
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      # A release cut from an unbumped commit would otherwise publish under the old version.
      - name: Check that the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version."
            exit 1
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint:package
      - run: npm publish
